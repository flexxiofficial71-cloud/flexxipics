<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1B" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Dark Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Camera Body & Shutter / Lock Symbol -->
  <g filter="url(#glow)">
    <!-- Shackle / Top Vault Arc -->
    <path d="M25 25V20C25 16.134 28.134 13 32 13C35.866 13 39 16.134 39 20V25" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Vault / Camera Center Base -->
    <rect x="18" y="24" width="28" height="23" rx="6" fill="#141312" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Central Aperture Lens / Keyhole Dial -->
    <circle cx="32" cy="35.5" r="6" stroke="url(#goldGrad)" stroke-width="2" fill="#24221D" />
    <circle cx="32" cy="35.5" r="2.5" fill="url(#goldGrad)" />
    
    <!-- Luxury Diamond Sparkle / Flash -->
    <path d="M41 28L42.5 29.5L41 31L39.5 29.5Z" fill="url(#goldGrad)" />
  </g>
</svg>
